<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>눈싸움 | 도파#</title>
<meta name="description" content="먼저 깜빡이면 진다. 카메라가 내 눈을 읽는 눈싸움 게임. 캐릭터와 겨루거나 친구와 실시간 1:1로.">
<meta name="dopasharp:game" content="staring-contest">
<link rel="canonical" href="https://dopasharp.github.io/staring-contest/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="도파# dopa.shap">
<meta property="og:title" content="눈싸움 👁️ 먼저 깜빡이면 진다">
<meta property="og:description" content="카메라가 내 눈을 다 보고 있어요. 고양이, 부엉이, 압박 면접관… 그리고 친구와 실시간 1:1.">
<meta property="og:url" content="https://dopasharp.github.io/staring-contest/">
<meta property="og:image" content="https://dopasharp.github.io/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B0E0D">
<link rel="icon" href="dopasharp/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="dopasharp/tokens.css">
<link rel="stylesheet" href="dopasharp/components.css">
<script src="dopasharp/dopasharp.js" defer></script>
<style>
  /* 눈싸움은 도파# 프레임 안에서 붉은 긴장감(--hot)을 자기 색으로 써요. */
  :root { --hot: #FF4D6D; --eye: #F7F6F2; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100dvh; background: var(--color-bg); color: var(--color-text);
    font-family: var(--font-body); -webkit-font-smoothing: antialiased;
    overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; }
  .app { max-width: 520px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 16px env(safe-area-inset-bottom); }
  .app > header { padding-top: max(8px, env(safe-area-inset-top)); }
  .screen { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 8px 0 24px; }
  .screen[hidden] { display: none; }
  .sound-btn { position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 30; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); font-size: 18px; cursor: pointer; }
  .back { align-self: flex-start; background: none; border: 0; color: var(--color-text-muted); padding: 8px 0; cursor: pointer; font-size: var(--text-small); }
  .muted { color: var(--color-text-muted); }
  .small { font-size: var(--text-small); }
  .err { color: var(--color-error); font-size: var(--text-small); min-height: 1.2em; margin: 0; }

  /* 홈 */
  .hero { text-align: center; padding: 12px 0 0; }
  .hero canvas { width: 100%; max-width: 300px; aspect-ratio: 1.6; display: block; margin: 0 auto; }
  .hero h1 { font-size: var(--text-display); line-height: var(--leading-tight); margin: 4px 0 8px; letter-spacing: -0.04em; }
  .hero h1 em { font-style: normal; color: var(--hot); }
  .hero p { margin: 0; color: var(--color-text-muted); line-height: var(--leading-body); }
  .modes { display: grid; gap: 12px; }
  .mode { display: flex; align-items: center; gap: 14px; text-align: left; padding: 18px; border-radius: var(--radius-lg); border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); cursor: pointer; transition: transform var(--duration-fast) var(--ease-standard), border-color var(--duration-fast); }
  .mode:hover { border-color: var(--color-brand); }
  .mode:active { transform: scale(.98); }
  .mode .art { font-size: 34px; width: 52px; text-align: center; }
  .mode b { display: block; font-size: var(--text-h3); }
  .mode small { color: var(--color-text-muted); }
  .mode.hot { border-color: var(--hot); background: linear-gradient(135deg, rgba(255,77,109,.18), var(--color-surface) 60%); }
  .privacy { font-size: 13px; color: var(--color-text-muted); line-height: 1.55; padding: 12px 14px; border-radius: var(--radius-md); background: var(--color-surface); margin: 0; }

  /* 상대 고르기 */
  h2.title { font-size: var(--text-h2); margin: 0; letter-spacing: -0.02em; }
  .foes { display: grid; gap: 10px; }
  .foe { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px 10px 10px; border-radius: var(--radius-lg); background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text); cursor: pointer; text-align: left; }
  .foe canvas { width: 72px; height: 72px; border-radius: var(--radius-md); background: var(--color-surface-raised); }
  .foe b { display: block; font-size: 18px; }
  .foe small { color: var(--color-text-muted); display: block; line-height: 1.4; }
  .foe .rec { font-size: 13px; color: var(--color-brand); font-variant-numeric: tabular-nums; text-align: right; }
  .foe[disabled] { opacity: .45; cursor: not-allowed; }
  .foe .lv { font-size: 11px; letter-spacing: .08em; color: var(--hot); font-weight: 700; }

  /* 1:1 입장 */
  .join { display: flex; gap: 8px; }
  .join input { flex: 1; min-width: 0; height: var(--button-height); border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); font: inherit; font-size: 24px; text-align: center; letter-spacing: .3em; font-variant-numeric: tabular-nums; }
  .or { text-align: center; color: var(--color-text-muted); font-size: var(--text-small); }

  /* 카메라 준비 */
  .setup-cam { position: relative; width: 100%; aspect-ratio: 3/4; max-height: 52dvh; border-radius: var(--radius-xl); overflow: hidden; background: var(--color-surface); margin: 0 auto; }
  body > video { display: none; }
  .setup-cam video, .cam video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .setup-cam .guide { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .setup-cam .guide i { width: 58%; aspect-ratio: .78; border: 3px dashed rgba(255,255,255,.55); border-radius: 50%; }
  .setup-msg { text-align: center; font-size: var(--text-h3); font-weight: 700; margin: 0; min-height: 2.6em; display: grid; place-items: center; line-height: 1.3; }
  .setup-msg small { display: block; font-size: var(--text-small); font-weight: 400; color: var(--color-text-muted); }
  .bar { height: 6px; border-radius: 3px; background: var(--color-surface-raised); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--color-brand); transition: width .1s linear; }

  /* 경기장 */
  #arena { gap: 10px; padding-bottom: 12px; }
  .hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; }
  .hud .who { font-weight: 700; font-size: var(--text-small); }
  .hud .best { font-size: 12px; color: var(--color-text-muted); text-align: right; font-variant-numeric: tabular-nums; }
  .timer { font-size: 44px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .stage { position: relative; flex: 1; min-height: 300px; border-radius: var(--radius-xl); overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #232a29, #0e1211 70%); }
  .stage.danger { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow: inset 0 0 70px rgba(255,77,109,.45); } }
  .stage.shake { animation: shake .12s linear 8; }
  @keyframes shake { 25% { transform: translate(6px,-3px) rotate(.6deg); } 75% { transform: translate(-6px,3px) rotate(-.6deg); } }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bubble { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); max-width: 86%; padding: 10px 16px; border-radius: 18px; background: #fff; color: #111; font-weight: 700; font-size: 17px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.3); animation: pop .2s var(--ease-standard); z-index: 3; }
  .bubble[hidden] { display: none; }
  @keyframes pop { from { transform: translateX(-50%) scale(.6); opacity: 0; } }
  .fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
  .fly { position: absolute; font-size: 34px; will-change: transform; }
  .wind { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: 46px; font-weight: 900; color: #bfe9ff; text-shadow: 0 0 20px rgba(150,220,255,.8); animation: wind 1.2s ease-out forwards; }
  @keyframes wind { from { transform: translateX(-60%); opacity: 0; } 30% { opacity: 1; } to { transform: translateX(60%); opacity: 0; } }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 4; text-align: center; }
  .overlay .big { font-size: 96px; font-weight: 900; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.6); animation: zoom .5s var(--ease-standard); }
  .overlay .stamp { font-size: 64px; font-weight: 900; color: var(--hot); border: 6px solid var(--hot); border-radius: 16px; padding: 4px 18px; transform: rotate(-12deg); background: rgba(11,14,13,.6); animation: stamp .25s var(--ease-standard); }
  .overlay .stamp.win { color: var(--color-brand); border-color: var(--color-brand); }
  .overlay .tip { position: absolute; bottom: 14px; left: 14px; right: 14px; font-size: 14px; color: #fff; background: rgba(0,0,0,.45); padding: 8px 12px; border-radius: 12px; }
  @keyframes zoom { from { transform: scale(2.2); opacity: 0; } }
  @keyframes stamp { from { transform: rotate(-12deg) scale(2.4); opacity: 0; } }
  .me { display: flex; gap: 12px; align-items: center; }
  .cam { position: relative; width: 96px; height: 96px; flex: none; border-radius: 50%; overflow: hidden; background: var(--color-surface); border: 3px solid var(--color-border); }
  .cam.closed { border-color: var(--hot); }
  .cam.noface::after { content: '얼굴이\A안 보여요'; white-space: pre; position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 12px; font-weight: 700; background: rgba(255,77,109,.7); color: #fff; }
  .meter { flex: 1; }
  .meter .label { display: flex; justify-content: space-between; font-size: 12px; color: var(--color-text-muted); margin-bottom: 6px; }
  .meter .track { position: relative; height: 14px; border-radius: 7px; background: var(--color-surface-raised); overflow: hidden; }
  .meter .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, var(--hot), #ffb84d 40%, var(--color-brand)); transition: width 60ms linear; }
  .meter .track b { position: absolute; top: -2px; bottom: -2px; width: 3px; background: #fff; }
  .testkey { margin-top: 8px; width: 100%; height: 40px; border-radius: var(--radius-md); border: 1px dashed var(--color-border); background: transparent; color: var(--color-text-muted); font-size: 13px; touch-action: none; user-select: none; -webkit-user-select: none; }

  /* 1:1 대기실 */
  .lobby { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 5; padding: 14px; border-radius: var(--radius-lg); background: rgba(21,25,26,.94); border: 1px solid var(--color-border); display: grid; gap: 10px; backdrop-filter: blur(6px); }
  .lobby[hidden] { display: none; }
  .lobby .code { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .lobby .code b { font-size: 34px; letter-spacing: .2em; font-variant-numeric: tabular-nums; color: var(--color-brand); }
  .lobby .status { font-size: var(--text-small); color: var(--color-text-muted); margin: 0; }
  .skins { display: flex; gap: 8px; }
  .skins button { flex: 1; height: 44px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-surface-raised); color: var(--color-text); cursor: pointer; font-size: 13px; }
  .skins button[aria-pressed="true"] { border-color: var(--color-brand); color: var(--color-brand); }
  .vs { position: absolute; top: 12px; left: 12px; z-index: 3; font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: rgba(0,0,0,.45); }

  /* 결과 */
  .result { text-align: center; display: grid; gap: 14px; }
  .result .verdict { font-size: var(--text-h1); font-weight: 900; margin: 8px 0 0; letter-spacing: -0.03em; }
  .result .verdict.win { color: var(--color-brand); }
  .result .verdict.lose { color: var(--hot); }
  .result .time { font-size: 64px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
  .result .time small { font-size: 22px; color: var(--color-text-muted); margin-left: 4px; }
  .result .line { color: var(--color-text-muted); margin: 0; line-height: 1.5; }
  .result .newrec { justify-self: center; font-size: 13px; font-weight: 800; color: var(--color-on-brand); background: var(--color-brand); padding: 4px 12px; border-radius: 999px; animation: stamp .4s var(--ease-standard); }
  .result canvas { width: 100%; max-width: 360px; justify-self: center; border-radius: var(--radius-lg); }
  .actions { display: grid; gap: 10px; }
  .actions .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (prefers-reduced-motion: reduce) { .stage.shake, .stage.danger { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header data-dopa="header"></header>

  <!-- 홈 -->
  <section class="screen" id="home">
    <div class="hero">
      <canvas id="heroCanvas" width="600" height="375" aria-hidden="true"></canvas>
      <h1>먼저 깜빡이면<br><em>진다.</em></h1>
      <p>카메라가 당신의 눈을 보고 있어요.<br>깜빡이는 순간, 바로 들켜요.</p>
    </div>
    <div class="modes">
      <button class="mode" id="goSolo" type="button"><span class="art" aria-hidden="true">🐱</span><span><b>혼자 하기</b><small>고양이부터 물고기까지, 방해 공작을 버텨요</small></span></button>
      <button class="mode hot" id="goDuo" type="button"><span class="art" aria-hidden="true">⚔️</span><span><b>친구랑 1:1</b><small>실시간 대결. 내 표정이 캐릭터로 보여요</small></span></button>
    </div>
    <p class="privacy">🔒 카메라 영상은 <b>이 폰 안에서만</b> 처리돼요. 저장하거나 어디로 보내지 않아요.<br>1:1에서는 얼굴 대신 <b>눈 뜬 정도 같은 숫자만</b> 상대에게 보내고, 상대에게는 캐릭터로 보여요.</p>
  </section>

  <!-- 상대 고르기 -->
  <section class="screen" id="pick" hidden>
    <button class="back" data-go="home" type="button">← 처음으로</button>
    <h2 class="title">누구랑 붙을까요?</h2>
    <div class="foes" id="foes"></div>
    <p class="muted small">이기면 다음 상대가 열려요.</p>
  </section>

  <!-- 1:1 입장 -->
  <section class="screen" id="duo" hidden>
    <button class="back" data-go="home" type="button">← 처음으로</button>
    <h2 class="title">친구랑 1:1</h2>
    <p class="muted" style="margin:0">방을 만들고 링크를 보내거나, 친구가 알려준 4자리 코드로 들어가요.</p>
    <button class="dopa-button dopa-button--block" id="makeRoom" type="button">방 만들기</button>
    <div class="or">또는</div>
    <form class="join" id="joinForm">
      <input id="codeInput" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="0000" aria-label="방 코드 4자리" autocomplete="off">
      <button class="dopa-button dopa-button--secondary" type="submit">입장</button>
    </form>
    <p class="err" id="duoErr" role="alert"></p>
    <p class="muted small" id="duoMode"></p>
  </section>

  <!-- 카메라 준비 + 보정 -->
  <section class="screen" id="setup" hidden>
    <button class="back" data-go="home" type="button">← 처음으로</button>
    <div class="setup-cam" id="setupCam"><div class="guide"><i></i></div></div>
    <p class="setup-msg" id="setupMsg">카메라로 눈을 읽어요<small>얼굴이 동그라미 안에 오게 해 주세요</small></p>
    <div class="bar"><i id="setupBar"></i></div>
    <p class="err" id="setupErr" role="alert"></p>
    <button class="dopa-button dopa-button--block" id="camBtn" type="button">카메라 켜기</button>
  </section>

  <!-- 경기장 -->
  <section class="screen" id="arena" hidden>
    <div class="hud">
      <span class="who" id="foeName"></span>
      <span class="timer" id="timer" aria-live="off">0.00</span>
      <span class="best" id="bestHud"></span>
    </div>
    <div class="stage" id="stage">
      <canvas id="foeCanvas"></canvas>
      <div class="vs" id="vsTag" hidden></div>
      <div class="bubble" id="bubble" hidden></div>
      <div class="fx" id="fx"></div>
      <div class="overlay" id="overlay"></div>
      <div class="lobby" id="lobby" hidden>
        <div class="code"><span class="muted small">방 코드</span><b id="roomCode">----</b><button class="dopa-button dopa-button--secondary" id="invite" type="button" style="height:40px">초대 링크</button></div>
        <p class="status" id="lobbyStatus" aria-live="polite"></p>
        <div class="skins" id="skins" role="group" aria-label="내 캐릭터"></div>
        <button class="dopa-button dopa-button--block" id="readyBtn" type="button">준비 완료</button>
      </div>
    </div>
    <div class="me">
      <div class="cam" id="cam"></div>
      <div class="meter">
        <div class="label"><span>내 눈</span><span id="meterTxt">뜬 상태</span></div>
        <div class="track"><i id="meterFill"></i><b id="meterLine"></b></div>
        <button class="testkey" id="testKey" type="button" hidden>꾹 누르면 눈 감기 (테스트 모드 · 스페이스바)</button>
      </div>
    </div>
  </section>

  <!-- 결과 -->
  <section class="screen" id="result" hidden>
    <div class="result">
      <p class="verdict" id="verdict"></p>
      <div class="time" id="resTime"></div>
      <span class="newrec" id="newRec" hidden>🏆 신기록!</span>
      <p class="line" id="resLine"></p>
      <canvas id="shot" hidden></canvas>
    </div>
    <div class="actions">
      <button class="dopa-button dopa-button--block" id="againBtn" type="button">다시 하기</button>
      <div class="row">
        <button class="dopa-button dopa-button--secondary" id="shareBtn" type="button">결과 공유</button>
        <button class="dopa-button dopa-button--secondary" id="saveShot" type="button">사진 저장</button>
      </div>
      <button class="dopa-button dopa-button--tertiary" id="homeBtn" type="button">처음으로</button>
    </div>
  </section>

  <footer data-dopa="footer"></footer>
</div>
<button class="sound-btn" id="soundBtn" type="button" aria-label="소리 끄기">🔊</button>
<video id="video" playsinline muted autoplay></video>
<script type="module" src="js/main.js"></script>
</body>
</html>
