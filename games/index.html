<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모든 게임 | 도파#</title>
<meta name="description" content="설치 없이 바로 하는 도파# 미니게임 전체 목록. 하나 골라서 바로 놀아보세요.">
<meta name="theme-color" content="#0B0E0D">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://dopasharp.github.io/games/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="도파# dopa.sharp">
<meta property="og:url" content="https://dopasharp.github.io/games/">
<meta property="og:title" content="도파# · 모든 게임">
<meta property="og:description" content="설치 없이, 설명은 짧게, 재미는 바로. 누르면 재밌는 미니게임 모음.">
<meta property="og:image" content="https://dopasharp.github.io/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../styles/tokens.css?v=20261115b">
<link rel="stylesheet" href="../styles/site.css?v=20261115b">
<style>
  /* Games page: the home page's cards and filters, without the hero extras. */
  .hero { padding: var(--space-8) 0 var(--space-6); }
  .hero h1 { font-size: clamp(34px, 6vw, 64px); }
  .section-head { margin-top: 0; }
  .back { text-decoration: none; }
  .back[hidden] { display: none; }
  @media (min-width: 768px) { .hero { padding-block: var(--space-12) var(--space-8); } .section-head { margin-top: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="../" aria-label="도파# 홈">
      <span class="brand-mark" aria-hidden="true">D#</span>
      <span class="brand-name">dopa.sharp<span>INTERACTIVE STUDIO</span></span>
    </a>
    <a class="icon-btn back" id="back" href="../" hidden>← <span id="backName">돌아가기</span></a>
  </header>

  <section class="hero">
    <p class="eyebrow">ALL GAMES</p>
    <h1>다음엔 <em>뭐 하고 놀까요?</em></h1>
    <p class="sub">설치 없이 바로. 하나 골라서 눌러보세요.</p>
  </section>
</div>

<main class="wrap">
  <div class="section-head">
    <h3>취향대로 골라보세요</h3>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <div class="chips" role="toolbar" aria-label="놀거리 필터" id="chips"></div>
  <div class="groups" id="groups"></div>
</main>

<footer class="wrap">
  <p class="footer-brand">D#</p>
  <p class="slogan">하나의 브랜드. <em>서로 다른 재미.</em></p>
  <p class="contact">게임 아이디어 · 제휴 문의<br><a href="mailto:dopasharp@gmail.com">✉️ dopasharp@gmail.com</a></p>
  <p class="small">MADE FOR FUN · dopa.sharp · <a href="https://github.com/dopasharp" target="_blank" rel="noopener">GITHUB</a></p>
</footer>

<script src="../analytics.js"></script>
<script src="../games.js?v=20261115b"></script>
<script>
  const BASE = 'https://dopasharp.github.io/';
  const $ = id => document.getElementById(id);
  const url = g => BASE + g.id + '/';
  // Games link here with ?from=<repo>; that game is hidden and becomes the back link.
  const from = new URLSearchParams(location.search).get('from');
  const GAMES = window.DOPA_GAMES.map((g, i) => ({ ...g, no: String(i + 1).padStart(3, '0') })).filter(g => !g.hidden);
  const came = GAMES.find(g => g.id === from && !g.comingSoon);
  if (came) {
    $('back').href = url(came);
    $('backName').textContent = came.emoji + ' 돌아가기';
    $('back').setAttribute('aria-label', came.name + '(으)로 돌아가기');
    $('back').title = came.name + '(으)로 돌아가기';
    $('back').hidden = false;
  }
  // 내기 · 혼자 놀기 · 이벤트·선물, each sorted by rank (same as the home page)
  const card = g => `
    <li data-quick="${g.quick ? 1 : 0}">
      ${g.comingSoon ? '<div class="card next">' : `<a class="card" href="${url(g)}">`}
        <span class="no">도파# ${g.no}</span>
        <span class="emoji" aria-hidden="true">${g.emoji}</span>
        <h4>${g.name}</h4>
        <p class="hook">${g.hook}</p>
        ${g.play ? `<span class="play${g.quick ? ' quick' : ''}">${g.play}</span>` : ''}
        ${g.comingSoon ? '<span class="card-cta pending">출시 준비 중</span>' : `<span class="card-cta">${g.quick ? '바로 시작' : '한 판 하기'} <span aria-hidden="true">↗</span></span>`}
      ${g.comingSoon ? '</div>' : '</a>'}
    </li>`;
  $('groups').innerHTML = window.DOPA_GROUPS.map(gr => `
    <section class="group" data-group="${gr.key}" aria-labelledby="group-${gr.key}-title">
      <div class="group-head"><h3 id="group-${gr.key}-title">${gr.title}</h3><p>${gr.desc}</p></div>
      <ul class="grid">${GAMES.filter(g => g.group === gr.key && g !== came).sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99)).map(card).join('')}</ul>
    </section>`).join('');
  const sections = [...$('groups').children];
  function applyFilter(key) {
    let n = 0;
    sections.forEach(sec => {
      let shown = 0;
      [...sec.querySelectorAll('li')].forEach(li => {
        const show = (key === 'all' || key === sec.dataset.group) || (key === 'quick' && li.dataset.quick === '1');
        li.hidden = !show;
        if (show) { shown++; if (li.querySelector('a.card')) n++; }
      });
      sec.hidden = !shown;
    });
    $('count').textContent = n + '개 플레이 가능';
    [...$('chips').children].forEach(c => c.setAttribute('aria-pressed', c.dataset.key === key));
  }
  $('chips').innerHTML = window.DOPA_FILTERS.map(([k, label]) => `<button class="chip" type="button" data-key="${k}" aria-pressed="false">${label}</button>`).join('');
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (b) applyFilter(b.dataset.key);
  });
  applyFilter('all');
</script>
</body>
</html>
